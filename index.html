<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイバーネオン掲示板 (軽量版)</title>
  <style>
    /* 🌌 全体の背景と文字 */
    body { 
      font-family: sans-serif; 
      background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%); 
      color: #f5f5f7; 
      padding: 20px; 
      margin: 0;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: var(--neon-color, #00fff0); text-shadow: 0 0 10px var(--neon-glow, rgba(0, 255, 240, 0.4)); }

    /* ⏰ デジタル時計 */
    .clock-box {
      text-align: center; font-family: monospace; font-size: 2.2em; font-weight: bold;
      color: var(--neon-color, #00fff0); text-shadow: 0 0 10px var(--neon-glow, rgba(0, 255, 240, 0.4));
      margin-bottom: 20px; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 8px;
      border: 1px solid var(--neon-color, rgba(0, 255, 240, 0.2));
    }

    /* 📦 コンテンツの枠 */
    .box { 
      background: rgba(30, 30, 45, 0.8); padding: 15px; margin-bottom: 15px; border-radius: 12px; 
      border: 1px solid var(--neon-color, rgba(0, 255, 240, 0.15));
    }
    input, textarea, button { 
      width: 100%; padding: 12px; margin-bottom: 10px; background: rgba(15, 15, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; box-sizing: border-box; 
    }
    button { 
      background: linear-gradient(45deg, #007bff, var(--neon-color, #00fff0)); color: #111119; font-weight: bold; cursor: pointer;
    }
    .post { background: rgba(255, 255, 255, 0.03); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .post-header { font-size: 0.85em; color: #aaa; margin-bottom: 5px; }
    .flex-grid { display: flex; gap: 10px; }
    .flex-grid button { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- ⏰ デジタル時計 -->
    <div class="clock-box" id="digital-clock">00:00:00</div>

    <h1>🚀 多機能サイバー掲示板</h1>

    <!-- 🎨 大好きなオレンジもあるカラーテーマ -->
    <div class="box">
      <h3 style="margin-top:0;">🎨 カラー切り替え</h3>
      <div class="flex-grid">
        <button onclick="changeTheme('#00fff0', 'rgba(0,255,240,0.4)')" style="background:#00fff0; color:#000;">シアン</button>
        <button onclick="changeTheme('#ff007f', 'rgba(255,0,127,0.4)')" style="background:#ff007f; color:#fff;">ピンク</button>
        <button onclick="changeTheme('#39ff14', 'rgba(57,255,20,0.4)')" style="background:#39ff14; color:#000;">グリーン</button>
        <button onclick="changeTheme('#ffaa00', 'rgba(255,170,0,0.4)')" style="background:#ffaa00; color:#000;">オレンジ</button>
      </div>
    </div>

    <!-- 🤖 疑似AI自動返信掲示板 -->
    <div class="box">
      <h3 style="margin-top:0;">📝 書き込み (なんJ民AI連動)</h3>
      <input type="text" id="user-name" placeholder="名前">
      <textarea id="post-content" rows="3" placeholder="本文を入力して書き込んでね"></textarea>
      <button onclick="submitVirtualPost()">書き込む</button>
    </div>

    <div class="box">
      <h3 style="margin-top:0;">💬 投稿一覧</h3>
      <div id="post-list"></div>
    </div>
  </div>

  <script>
    // ⏰ 時計の処理
    function updateClock() {
      const now = new Date();
      document.getElementById('digital-clock').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000); updateClock();

    // 🎨 テーマ変更
    function changeTheme(c, g) { 
      document.documentElement.style.setProperty('--neon-color', c); 
      document.documentElement.style.setProperty('--neon-glow', g); 
    }

    // 🤖 なんJ民のデータ
    let virtualPosts = [
      { name: "名無しさん", content: "ここが新しい自作スレか。うまいことiフィルター回避できてるなｗｗ", date: "17:00:00" }
    ];

    const aiResponses = [
      "うはｗｗｗｗ主それマジ？ｗｗｗｗ",
      ">>1 乙。この掲示板、天才すぎて草生えるわ",
      "お前それ教育委員会に見つかったら廊下立たされるやつだろｗｗｗ",
      "オレンジテーマにすると秘密基地っぽくてエモいぞ！",
      "いいぞもっとやれ。次は何の機能追加するんだ？"
    ];

    function renderVirtualPosts() {
      const listDiv = document.getElementById('post-list');
      listDiv.innerHTML = "";
      virtualPosts.forEach((post, i) => {
        const postDiv = document.createElement('div'); postDiv.className = 'post';
        postDiv.innerHTML = `<div class="post-header">${i+1}: <b>${escapeHtml(post.name)}</b> ${post.date}</div><div>${escapeHtml(post.content)}</div>`;
        listDiv.appendChild(postDiv);
      });
    }

    function submitVirtualPost() {
      const name = document.getElementById('user-name').value || "名無しさん(主)";
      const content = document.getElementById('post-content').value;
      if(!content.trim()) return alert("本文を入れてね");

      const nowStr = new Date().toLocaleTimeString('ja-JP');
      virtualPosts.push({ name: name, content: content, date: nowStr });
      document.getElementById('post-content').value = "";
      renderVirtualPosts();

      setTimeout(() => {
        const randomReply = aiResponses[Math.floor(Math.random() * aiResponses.length)];
        virtualPosts.push({ name: "名無しさん", content: randomReply, date: new Date().toLocaleTimeString('ja-JP') });
        renderVirtualPosts();
      }, 1000);
    }

    function escapeHtml(str) { if (!str) return ""; return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    renderVirtualPosts();
  </script>
</body>
</html>

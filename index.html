<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超未来型サイバーポータル掲示板</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%); 
      color: #f5f5f7; 
      padding: 30px 20px; 
      margin: 0;
      min-height: 100vh;
    }
    .container { max-width: 750px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: var(--neon-color, #00fff0);
      font-size: 2.2em;
      text-shadow: 0 0 15px var(--neon-glow, rgba(0, 255, 240, 0.4));
      margin-bottom: 20px;
    }
    .clock-box {
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.5em;
      font-weight: bold;
      color: var(--neon-color, #00fff0);
      text-shadow: 0 0 10px var(--neon-glow, rgba(0, 255, 240, 0.4));
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--neon-color, rgba(0, 255, 240, 0.2));
    }
    .box { 
      background: rgba(30, 30, 45, 0.75); 
      padding: 20px; 
      margin-bottom: 20px; 
      border-radius: 12px; 
      border: 1px solid var(--neon-color, rgba(0, 255, 240, 0.15));
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    .box h3 {
      margin-top: 0;
      color: var(--neon-color, #00fff0);
      border-left: 4px solid var(--neon-color, #00fff0);
      padding-left: 10px;
      font-size: 1.1em;
    }
    input, textarea, button, select { 
      width: 100%; padding: 12px; margin-bottom: 12px; 
      background: rgba(15, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px; color: #fff; font-size: 0.95em; box-sizing: border-box; 
    }
    button { 
      background: linear-gradient(45deg, #007bff, var(--neon-color, #00fff0)); 
      color: #111119; border: none; cursor: pointer; font-weight: bold; 
    }
    .post { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .post-header { font-size: 0.85em; color: #aaa; margin-bottom: 8px; }
    .post-header b { color: #fff; }
    .post-content { font-size: 1em; line-height: 1.5; color: #e5e5e7;}
    #game-canvas { background: #000; display: block; margin: 10px auto; border: 2px solid var(--neon-color, #00fff0); }
    .flex-grid { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- ⏰ デジタル時計 -->
    <div class="clock-box" id="digital-clock">00:00:00</div>

    <h1>🚀 究極多機能サイバーポータル</h1>

    <!-- 🎨 カラーテーマ -->
    <div class="box">
      <h3>🎨 カラーテーマ切り替え</h3>
      <div class="flex-grid">
        <button onclick="changeTheme('#00fff0', 'rgba(0,255,240,0.4)')" style="background:#00fff0; color:#000;">シアン</button>
        <button onclick="changeTheme('#ff007f', 'rgba(255,0,127,0.4)')" style="background:#ff007f;">ピンク</button>
        <button onclick="changeTheme('#39ff14', 'rgba(57,255,20,0.4)')" style="background:#39ff14; color:#000;">グリーン</button>
      </div>
    </div>

    <!-- 🎵 1. サイバーBGM・効果音 -->
    <div class="box">
      <h3>🎵 サイバーBGM・タイマー音</h3>
      <div class="flex-grid">
        <button onclick="toggleBpmSound(880)">🔊 警告音</button>
        <button onclick="toggleBpmSound(440)">🎵 ピコピコ音</button>
        <button onclick="stopSound()" style="background:#dc3545; color:#fff;">📴 音を止める</button>
      </div>
    </div>

    <!-- 🔐 2. 暗号化・復号化ツール -->
    <div class="box">
      <h3>🔐 秘密の暗号化ツール</h3>
      <input type="text" id="crypto-input" placeholder="暗号化・復号化したい文字を入力">
      <div class="flex-grid">
        <button onclick="runCipher(true)">🔒 暗号化</button>
        <button onclick="runCipher(false)" style="background:#6c757d;">🔓 元に戻す</button>
      </div>
      <p id="crypto-result" style="background:rgba(0,0,0,0.3); padding:10px; border-radius:6px; font-family:monospace; color:#39ff14; word-break:break-all;"></p>
    </div>

    <!-- ⏱ 3. 記録用タイマー＆簡易計算機 -->
    <div class="box">
      <h3>⏱ 記録用ストップウォッチ ＆ 爆速計算</h3>
      <div style="text-align:center; font-size:1.8em; font-family:monospace; margin-bottom:10px;" id="timer-display">00:00.00</div>
      <div class="flex-grid" style="margin-bottom:15px;">
        <button onclick="startTimer()">▶ スタート</button>
        <button onclick="stopTimer()" style="background:#ffaa00;">⏸ ストップ</button>
        <button onclick="resetTimer()" style="background:#6c757d;">🔄 リセット</button>
      </div>
      
      <input type="text" id="calc-input" placeholder="数式を入力 (例: 123 + 456 * 2)" onkeyup="if(e.key==='Enter')runCalc()">
      <button onclick="runCalc()">🧮 計算する</button>
      <p id="calc-result" style="font-weight:bold; color:#00fff0; margin:5px 0 0 0;"></p>
    </div>

    <!-- 🎮 ミニゲーム -->
    <div class="box">
      <h3>🎮 特製ミニゲーム (スネーク)</h3>
      <canvas id="game-canvas" width="300" height="300"></canvas>
      <button onclick="resetGame()" style="background:#222; color:#fff; border:1px solid #555;">ゲームリセット</button>
    </div>

    <!-- 🤖 「これ出来るかな？」疑似AI過去ログ自動返信掲示板 -->
    <div class="box">
      <h3>💬 2ch風 疑似AI自動返信掲示板 (学校でも100%連動!)</h3>
      <p style="font-size:0.8em; color:#aaa; margin:0 0 10px 0;">何か書き込むと、掲示板の住人たちがその場で自動でレスポンス（返信）をくれます！</p>
      <input type="text" id="user-name" placeholder="名前">
      <textarea id="post-content" rows="3" placeholder="本文を入力して書き込むと、住人が反応します"></textarea>
      <button onclick="submitVirtualPost()">書き込む (疑似AI連動)</button>
    </div>

    <div class="box">
      <h3>💬 投稿一覧</h3>
      <div id="post-list"></div>
    </div>
  </div>

  <script>
    // ⏰ 時計
    function updateClock() {
      const now = new Date();
      document.getElementById('digital-clock').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000); updateClock();

    // 🎨 テーマ
    function changeTheme(c, g) { document.documentElement.style.setProperty('--neon-color', c); document.documentElement.style.setProperty('--neon-glow', g); }

    // 🎵 1. BGM・効果音（ブラウザの機能だけで音を作ります）
    let audioCtx = null; let oscillator = null;
    function toggleBpmSound(freq) {
      stopSound();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = 'sine'; oscillator.frequency.value = freq;
      gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
      oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
      oscillator.start();
    }
    function stopSound() { if(oscillator){ oscillator.stop(); oscillator=null; } }

    // 🔐 2. 暗号化ツール（文字コードをずらす秘密の仕組み）
    function runCipher(isEncrypt) {
      const input = document.getElementById('crypto-input').value;
      const shift = isEncrypt ? 3 : -3;
      let res = "";
      for(let i=0; i<input.length; i++) {
        res += String.fromCharCode(input.charCodeAt(i) + shift);
      }
      document.getElementById('crypto-result').innerText = isEncrypt ? `🔒 暗号データ: ${res}` : `🔓 元の文字: ${res}`;
    }

    // ⏱ 3. タイマー＆計算機
    let timerInterval = null; let startTime = 0; let elapsedTime = 0;
    function startTimer() { if(!timerInterval){ startTime = Date.now() - elapsedTime; timerInterval = setInterval(()=>{ elapsedTime = Date.now() - startTime; const m=String(Math.floor(elapsedTime/60000)).padStart(2,'0'); const s=String(Math.floor((elapsedTime%60000)/1000)).padStart(2,'0'); const ms=String(Math.floor((elapsedTime%1000)/10)).padStart(2,'0'); document.getElementById('timer-display').innerText=`${m}:${s}.${ms}`; },10);}}
    function stopTimer() { clearInterval(timerInterval); timerInterval=null; }
    function resetTimer() { stopTimer(); elapsedTime=0; document.getElementById('timer-display').innerText="00:00.00"; }
    function runCalc() { try { const res = eval(document.getElementById('calc-input').value); document.getElementById('calc-result').innerText = `計算結果: ${res}`; } catch(e){ document.getElementById('calc-result').innerText = "エラー: 正しい計算式を入力してね"; } }

    // 🎮 スネークゲーム
    const canvas=document.getElementById('game-canvas'); const ctx=canvas.getContext('2d');
    let snake=[{x:10,y:10}]; let food={x:5,y:5}; let dx=1,dy=0;
    function gameLoop() {
      const head={x:snake[0].x+dx, y:snake[0].y+dy};
      if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){ctx.fillStyle="red"; ctx.font="20px Arial"; ctx.fillText("GAME OVER",90,150); return;}
      snake.unshift(head); if(head.x===food.x&&head.y===food.y){food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else{snake.pop();}
      ctx.clearRect(0,0,300,300); ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,14,14));
      ctx.fillStyle="red"; ctx.fillRect(food.x*15,food.y*15,14,14); setTimeout(gameLoop,150);
    }
    window.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;} if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;} if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;} if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}});
    function resetGame(){ snake=[{x:10,y:10}]; dx=1; dy=0; food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}; } gameLoop();

    // 🤖 疑似AI自動返信掲示板のデータ
    let virtualPosts = [
      { name: "名無しさん", content: "ここが新しい自作スレか。うまいことiフィルター回避できてるなｗｗ", date: "2026/08/26 17:00:00" },
      { name: "名無しさん", content: "お、主（開発者）ログインした？時計もゲームもあって草", date: "2026/08/26 17:02:00" }
    ];

    const aiResponses = [
      "うはｗｗｗｗ主それマジ？ｗｗｗｗ",
      ">>1 乙。このChromebookハック掲示板、天才すぎて草生えるわ",
      "お前それ教育委員会に見つかったら一発で廊下立たされるやつだろｗｗｗ",
      "荒らしは俺がIPブロックしとくから安心しろ。なお通信は繋がってない模様",
      "これJavaScriptだけで動いてるのか。iフィルター涙目でワロタ",
    const SUPABASE_URL = "https://supabase.co";
